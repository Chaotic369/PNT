<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Whiteboard & Paint App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; overflow: hidden; margin: 0; padding: 0; width: 100vw; height: 100vh; }
        .canvas-container { margin: 0 auto; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05); border-radius: 16px; }
        #canvas-wrapper {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col font-sans overflow-hidden">

    <header class="bg-white border-b border-slate-200/80 px-6 py-3.5 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center shadow-md shadow-cyan-500/20">
                <i class="fa-solid fa-chalkboard-user text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-slate-800 tracking-tight leading-none">StudioCanvas Pro</h1>
                <span class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Collaborative Workspace</span>
            </div>
        </div>
        <div class="flex items-center space-x-2.5">
            <button onclick="clearCanvas()" class="hover:bg-red-50 text-red-600 border border-transparent hover:border-red-200 px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center gap-2">
                <i class="fa-solid fa-trash-can"></i> Clear
            </button>
            <button onclick="downloadCanvas()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md shadow-slate-900/10 transition-all duration-200 flex items-center gap-2">
                <i class="fa-solid fa-download"></i> Export
            </button>
        </div>
    </header>

    <div class="flex flex-1 relative overflow-hidden w-full h-full">
        
        <!-- Floating Top Toolbar -->
        <div class="absolute top-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md shadow-lg border border-slate-200/80 rounded-2xl px-3 py-2 flex items-center gap-1.5 z-30">
            <button id="btn-select" onclick="setMode('select')" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center" title="Select / Move">
                <i class="fa-solid fa-arrow-pointer text-lg"></i>
            </button>
            <button id="btn-draw" onclick="setMode('draw')" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center" title="Free Draw">
                <i class="fa-solid fa-pen text-lg"></i>
            </button>
            <div class="h-6 w-[1px] bg-slate-200 mx-1"></div>
            <button onclick="addShape('rect')" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center" title="Rectangle">
                <i class="fa-regular fa-square text-lg"></i>
            </button>
            <button onclick="addShape('circle')" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center" title="Circle">
                <i class="fa-regular fa-circle text-lg"></i>
            </button>
            <button onclick="addShape('triangle')" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center" title="Triangle">
                <i class="fa-solid fa-triangle text-lg"></i>
            </button>
            <button onclick="addShape('line')" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center" title="Line">
                <i class="fa-solid fa-minus text-lg"></i>
            </button>
            <div class="h-6 w-[1px] bg-slate-200 mx-1"></div>
            <button onclick="addText()" class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center" title="Add Text">
                <i class="fa-solid fa-font text-lg"></i>
            </button>
            <label class="p-2.5 rounded-xl hover:bg-slate-100 text-slate-600 transition-all duration-200 flex items-center justify-center cursor-pointer" title="Insert Image">
                <i class="fa-solid fa-image text-lg"></i>
                <input type="file" id="image-loader" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Draggable Floating Settings Button -->
        <div id="floating-paint-btn" class="fixed bottom-6 right-6 z-40 cursor-pointer select-none" style="touch-action: none;">
            <div class="w-14 h-14 bg-cyan-500 hover:bg-cyan-600 text-white rounded-full shadow-lg shadow-cyan-500/30 flex items-center justify-center transition-all duration-200 transform hover:scale-105 active:scale-95 border-2 border-white">
                <i class="fa-solid fa-sliders text-xl"></i>
            </div>
        </div>

        <!-- Floating Pop-up Settings Panel -->
        <div id="settings-popup" class="fixed top-20 right-6 w-80 max-h-[calc(100vh-120px)] bg-white/95 backdrop-blur-md border border-slate-200/80 p-5 flex flex-col space-y-5 overflow-y-auto shadow-2xl rounded-2xl z-30 hidden transition-all duration-200">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Properties</h3>
                <button id="close-settings" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Styling Section -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Stroke / Brush Color</label>
                    <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-xl border border-slate-100">
                        <input type="color" id="color-picker" value="#06b6d4" class="w-8 h-8 border-0 rounded-lg cursor-pointer bg-transparent">
                        <span id="color-hex" class="text-sm text-slate-600 font-mono font-medium">#06b6d4</span>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Fill Color</label>
                    <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100">
                        <div class="flex items-center gap-3">
                            <input type="color" id="fill-picker" value="#ffffff" class="w-8 h-8 border-0 rounded-lg cursor-pointer bg-transparent">
                            <span id="fill-hex" class="text-sm text-slate-600 font-mono font-medium">None</span>
                        </div>
                        <button id="btn-no-fill" class="text-xs text-red-500 px-2.5 py-1 bg-red-50 hover:bg-red-100 rounded-lg font-medium transition-colors">No Fill</button>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Opacity</label>
                        <span class="text-xs font-bold text-cyan-600 bg-cyan-50 px-2 py-0.5 rounded"><span id="opacity-val">100</span>%</span>
                    </div>
                    <input type="range" id="opacity-slider" min="1" max="100" value="100" class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Brush / Border Size</label>
                        <span class="text-xs font-bold text-cyan-600 bg-cyan-50 px-2 py-0.5 rounded"><span id="brush-size-val">5</span>px</span>
                    </div>
                    <input type="range" id="brush-size" min="1" max="50" value="5" class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- Layer Actions -->
            <div>
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Layer Actions</h3>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="bringForward()" title="Bring Forward" class="flex items-center justify-center py-2.5 border border-slate-200 hover:bg-slate-50 rounded-xl text-slate-600 transition-all duration-200">
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                    <button onclick="sendBackward()" title="Send Backward" class="flex items-center justify-center py-2.5 border border-slate-200 hover:bg-slate-50 rounded-xl text-slate-600 transition-all duration-200">
                        <i class="fa-solid fa-arrow-down"></i>
                    </button>
                    <button onclick="duplicateObject()" title="Duplicate" class="flex items-center justify-center py-2.5 border border-slate-200 hover:bg-slate-50 rounded-xl text-slate-600 transition-all duration-200">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            </div>

            <hr class="border-slate-100">

            <div class="text-[11px] text-slate-400 leading-relaxed bg-slate-50 p-3 rounded-xl border border-slate-100">
                <i class="fa-solid fa-info-circle text-cyan-500 mr-1"></i> Tip: Select any object and press <kbd class="bg-white px-1.5 py-0.5 border border-slate-200 rounded shadow-sm font-sans font-semibold text-slate-600">Delete</kbd> to remove it.
            </div>
        </div>

        <main class="flex-1 flex items-center justify-center p-0 relative w-full h-full">
            <div id="canvas-wrapper" class="w-full h-full overflow-hidden">
                <canvas id="whiteboard"></canvas>
            </div>
        </main>
    </div>

    <script>
            let canvas;
            let currentMode = 'draw'; // select or draw

            // Initialize Application Components on window load
            window.addEventListener('DOMContentLoaded', () => {
                // Instantiate dynamic canvas sizing based on full viewport window space available
                const wrapper = document.getElementById('canvas-wrapper');
                const displayWidth = window.innerWidth; 
                const displayHeight = window.innerHeight - document.querySelector('header').offsetHeight;

                canvas = new fabric.Canvas('whiteboard', {
                    width: displayWidth,
                    height: displayHeight,
                    backgroundColor: '#ffffff',
                    isDrawingMode: true
                });

            window.addEventListener('resize', () => {
                canvas.setWidth(window.innerWidth);
                canvas.setHeight(window.innerHeight - document.querySelector('header').offsetHeight);
                canvas.renderAll();
            });

            // Initialize Event Listeners for UI sliders/controls
            setupControlListeners();
            setupKeyboardDelete();
            setupDraggablePopup();
        });

        // Setup Draggable Floating Button & Popup Toggle
        function setupDraggablePopup() {
            const floatBtn = document.getElementById('floating-paint-btn');
            const popup = document.getElementById('settings-popup');
            const closeBtn = document.getElementById('close-settings');

            let isDragging = false;
            let hasMoved = false;
            let startX, startY;
            let initialX, initialY;

            floatBtn.addEventListener('pointerdown', (e) => {
                isDragging = true;
                hasMoved = false;
                startX = e.clientX;
                startY = e.clientY;
                
                const rect = floatBtn.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;

                floatBtn.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            floatBtn.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                if (Math.hypot(dx, dy) > 5) {
                    hasMoved = true;
                }

                let newX = initialX + dx;
                let newY = initialY + dy;

                // Keep within window bounds
                const maxX = window.innerWidth - floatBtn.offsetWidth;
                const maxY = window.innerHeight - floatBtn.offsetHeight;
                newX = Math.max(0, Math.min(newX, maxX));
                newY = Math.max(0, Math.min(newY, maxY));

                floatBtn.style.left = `${newX}px`;
                floatBtn.style.top = `${newY}px`;
                floatBtn.style.bottom = 'auto';
                floatBtn.style.right = 'auto';
            });

            floatBtn.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                floatBtn.releasePointerCapture(e.pointerId);

                // If it was a click (not a drag), toggle popup
                if (!hasMoved) {
                    if (popup.classList.contains('hidden')) {
                        popup.classList.remove('hidden');
                        // Position popup near the button nicely
                                                const btnRect = floatBtn.getBoundingClientRect();
                                                let popupLeft = btnRect.right - popup.offsetWidth;
                                                let popupTop = btnRect.top - popup.offsetHeight - 12;
                        
                        if (popupLeft < 10) popupLeft = 10;
                        if (popupTop < 10) popupTop = btnRect.bottom + 12;

                        popup.style.left = `${popupLeft}px`;
                        popup.style.top = `${popupTop}px`;
                        popup.style.bottom = 'auto';
                        popup.style.right = 'auto';
                    } else {
                        popup.classList.add('hidden');
                    }
                }
            });

            closeBtn.addEventListener('click', () => {
                popup.classList.add('hidden');
            });
        }

        // Toggle Application Modes (Object Selection vs Vector Drawing)
        function setMode(mode) {
            currentMode = mode;
            const btnSelect = document.getElementById('btn-select');
            const btnDraw = document.getElementById('btn-draw');

            if (mode === 'draw') {
                canvas.isDrawingMode = true;
                btnDraw.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg border-2 border-cyan-500 bg-cyan-50 text-cyan-700 font-medium transition text-sm";
                btnSelect.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg border-2 border-gray-200 hover:border-gray-300 text-gray-700 font-medium transition text-sm";
            } else {
                canvas.isDrawingMode = false;
                btnSelect.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg border-2 border-cyan-500 bg-cyan-50 text-cyan-700 font-medium transition text-sm";
                btnDraw.className = "flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg border-2 border-gray-200 hover:border-gray-300 text-gray-700 font-medium transition text-sm";
            }
        }

        // Configure event callbacks for color wheels and sizing inputs
        function setupControlListeners() {
            const colorPicker = document.getElementById('color-picker');
            const fillPicker = document.getElementById('fill-picker');
            const opacitySlider = document.getElementById('opacity-slider');
            const brushSize = document.getElementById('brush-size');

            // Handle styling changes for brush engine and active objects
            colorPicker.addEventListener('input', (e) => {
                const color = e.target.value;
                document.getElementById('color-hex').textContent = color;
                canvas.freeDrawingBrush.color = color;
        
                const activeObj = canvas.getActiveObject();
                if (activeObj) {
                    if (activeObj.type === 'i-text') activeObj.set('fill', color);
                    else activeObj.set('stroke', color);
                    canvas.renderAll();
                }
            });

            fillPicker.addEventListener('input', (e) => {
                const color = e.target.value;
                document.getElementById('fill-hex').textContent = color;
                const activeObj = canvas.getActiveObject();
                if (activeObj && activeObj.type !== 'image' && activeObj.type !== 'line') {
                    activeObj.set('fill', color);
                    canvas.renderAll();
                }
            });

            document.getElementById('btn-no-fill').addEventListener('click', () => {
                document.getElementById('fill-hex').textContent = 'None';
                const activeObj = canvas.getActiveObject();
                if (activeObj && activeObj.type !== 'image' && activeObj.type !== 'line') {
                    activeObj.set('fill', 'transparent');
                    canvas.renderAll();
                }
            });

            opacitySlider.addEventListener('input', (e) => {
                const val = parseInt(e.target.value, 10);
                document.getElementById('opacity-val').textContent = val;
                const activeObj = canvas.getActiveObject();
                if (activeObj) {
                    activeObj.set('opacity', val / 100);
                    canvas.renderAll();
                }
            });

            brushSize.addEventListener('input', (e) => {
                const size = parseInt(e.target.value, 10);
                document.getElementById('brush-size-val').textContent = size;
                canvas.freeDrawingBrush.width = size;
                const activeObj = canvas.getActiveObject();
                if (activeObj && activeObj.type !== 'i-text' && activeObj.type !== 'image') {
                    activeObj.set('strokeWidth', size);
                    canvas.renderAll();
                }
            });

            // Handle file image insertion events
            document.getElementById('image-loader').addEventListener('change', handleMediaUpload);

            // Sync UI to selected object
            canvas.on('selection:created', syncUIToSelectedObject);
            canvas.on('selection:updated', syncUIToSelectedObject);

            // Set initial defaults
            canvas.freeDrawingBrush.color = colorPicker.value;
            canvas.freeDrawingBrush.width = parseInt(brushSize.value, 10);
        }

        // Sync Sidebar UI Controls to the currently selected canvas object
        function syncUIToSelectedObject() {
            const activeObj = canvas.getActiveObject();
            if (!activeObj) return;

            if (activeObj.opacity !== undefined) {
                const opacityVal = Math.round(activeObj.opacity * 100);
                document.getElementById('opacity-slider').value = opacityVal;
                document.getElementById('opacity-val').textContent = opacityVal;
            }

            if (activeObj.strokeWidth) {
                document.getElementById('brush-size').value = activeObj.strokeWidth;
                document.getElementById('brush-size-val').textContent = activeObj.strokeWidth;
            }

            if (activeObj.type === 'i-text') {
                if (activeObj.fill) {
                    document.getElementById('color-picker').value = activeObj.fill;
                    document.getElementById('color-hex').textContent = activeObj.fill;
                }
            } else {
                if (activeObj.stroke) {
                    document.getElementById('color-picker').value = activeObj.stroke;
                    document.getElementById('color-hex').textContent = activeObj.stroke;
                }
                if (activeObj.fill && activeObj.fill !== 'transparent') {
                    document.getElementById('fill-picker').value = activeObj.fill;
                    document.getElementById('fill-hex').textContent = activeObj.fill;
                } else if (activeObj.fill === 'transparent') {
                    document.getElementById('fill-hex').textContent = 'None';
                }
            }
        }

        // Instantiates Vector Shapes into canvas view state hierarchy
        function addShape(shapeType) {
            setMode('select'); // Default back to move/edit mode when inserting elements
            const color = document.getElementById('color-picker').value;
            const strokeWidth = parseInt(document.getElementById('brush-size').value, 10);
            const opacity = parseInt(document.getElementById('opacity-slider').value, 10) / 100;
            const fillType = document.getElementById('fill-hex').textContent === 'None' 
                ? 'transparent' 
                : document.getElementById('fill-picker').value;
    
            let shapeObject;
            const config = {
                left: canvas.width / 2 - 50,
                top: canvas.height / 2 - 50,
                fill: fillType,
                stroke: color,
                strokeWidth: strokeWidth,
                opacity: opacity,
                cornerColor: '#06b6d4',
                cornerSize: 8,
                transparentCorners: false
            };

            switch(shapeType) {
                case 'rect':
                    shapeObject = new fabric.Rect({ ...config, width: 140, height: 90 });
                    break;
                case 'circle':
                    shapeObject = new fabric.Circle({ ...config, radius: 60 });
                    break;
                case 'triangle':
                    shapeObject = new fabric.Triangle({ ...config, width: 120, height: 100 });
                    break;
                case 'line':
                    shapeObject = new fabric.Line([50, 50, 200, 50], {
                        stroke: color,
                        strokeWidth: strokeWidth,
                        left: canvas.width / 2 - 75,
                        top: canvas.height / 2
                    });
                    break;
            }
            
            if (shapeObject) {
                canvas.add(shapeObject);
                canvas.setActiveObject(shapeObject);
            }
        }

        // Instantiates editable rich text modules
        function addText() {
            setMode('select');
            const color = document.getElementById('color-picker').value;
            const opacity = parseInt(document.getElementById('opacity-slider').value, 10) / 100;
            const textNode = new fabric.IText('Double click to edit text', {
                left: canvas.width / 2 - 100,
                top: canvas.height / 2 - 20,
                fontFamily: 'sans-serif',
                fill: color,
                opacity: opacity,
                fontSize: 24,
                cornerColor: '#06b6d4'
            });
            canvas.add(textNode);
            canvas.setActiveObject(textNode);
        }

        // Media Stream Processing: Standard Images and Web-Agnostic Assets (including GIFs)
        function handleMediaUpload(e) {
            setMode('select');
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const imgObj = new Image();
                imgObj.src = event.target.result;
                
                imgObj.onload = function() {
                    const fabricImg = new fabric.Image(imgObj);
                    // Scale element down if bounding dimensions overshoot the board limits
                    if (fabricImg.width > canvas.width * 0.6) {
                        fabricImg.scaleToWidth(canvas.width * 0.5);
                    }
                    fabricImg.set({
                        left: canvas.width / 2 - (fabricImg.getScaledWidth() / 2),
                        top: canvas.height / 2 - (fabricImg.getScaledHeight() / 2),
                        cornerColor: '#06b6d4',
                        cornerSize: 8
                    });
                    canvas.add(fabricImg);
                    canvas.setActiveObject(fabricImg);
                    canvas.renderAll();
                }
            };
            reader.readAsDataURL(file);
            // Reset standard input value sequence so the same asset can be pulled multiple times
            e.target.value = '';
        }

        // Layering and Object Action Helpers
        function bringForward() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) { canvas.bringForward(activeObj); canvas.renderAll(); }
        }

        function sendBackward() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) { canvas.sendBackwards(activeObj); canvas.renderAll(); }
        }

        function duplicateObject() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                activeObj.clone(function(cloned) {
                    canvas.discardActiveObject();
                    cloned.set({
                        left: cloned.left + 20,
                        top: cloned.top + 20,
                        evented: true,
                    });
                    if (cloned.type === 'activeSelection') {
                        cloned.canvas = canvas;
                        cloned.forEachObject(function(obj) { canvas.add(obj); });
                        cloned.setCoords();
                    } else {
                        canvas.add(cloned);
                    }
                    canvas.setActiveObject(cloned);
                    canvas.requestRenderAll();
                });
            }
        }

        // Global Event Hook to listen to native hardware delete keys 
        function setupKeyboardDelete() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    // Avoid firing delete if user is currently typing within a text object
                    const activeObject = canvas.getActiveObject();
                    if (activeObject && (!activeObject.isEditing)) {
                        canvas.remove(activeObject);
                        canvas.discardActiveObject();
                        canvas.renderAll();
                    }
                }
            });
        }

        // Resets current canvas board viewport back to native blank array
        function clearCanvas() {
            if(confirm("Are you sure you want to clear your whiteboard? All unsaved work will be lost.")) {
                canvas.clear();
                canvas.setBackgroundColor('#ffffff', canvas.renderAll.bind(canvas));
            }
        }

        // Exports current canvas data state out to a downloadable PNG file
        function downloadCanvas() {
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1.0
            });
            const downloadLink = document.createElement('a');
            downloadLink.href = dataURL;
            downloadLink.download = 'whiteboard-export.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
